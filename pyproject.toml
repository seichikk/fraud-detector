[project]
name = "fraud-detector"
version = "0.2.0"
description = "сервис выявления мошеннических транзакций"
readme = "README.md"
authors = [
    { name = "seichikk", email = "trchfk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
fraud-detector = "fraud_detector.main:run"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
default-groups = ["dev", "web"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "C4", "PT", "ASYNC", "RUF", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
branch = true
source_pkgs = ["fraud_detector"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
