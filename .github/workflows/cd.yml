name: cd

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: полный ci на этом коммите
    uses: ./.github/workflows/ci.yml

  publish:
    name: сборка и публикация образа
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: забираем код
        uses: actions/checkout@v7

      - name: ставим uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: сверяем тег с версией в pyproject
        id: release
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с версией в pyproject.toml ($project_version)"
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: готовим эмуляцию arm64
        uses: docker/setup-qemu-action@v4

      - name: готовим buildx
        uses: docker/setup-buildx-action@v4

      - name: логинимся в ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: собираем теги и метки образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: собираем и пушим образ
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: проверка опубликованного образа
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      packages: read
    steps:
      - name: логинимся в ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: запускаем образ из реестра и спрашиваем версию
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          docker run --detach --name smoke --publish 8000:8000 "$IMAGE:$VERSION"
          for _ in $(seq 1 30); do
            curl --fail --silent http://localhost:8000/healthz && break
            sleep 1
          done
          reported="$(curl --fail --silent http://localhost:8000/api/v1/version | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          echo "в образе $IMAGE:$VERSION живёт версия $reported"
          test "$reported" = "$VERSION"
